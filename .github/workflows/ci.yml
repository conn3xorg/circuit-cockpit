name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Conn3x
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &install |
          tag=$(gh release view -R conn3xorg/conn3x --json tagName -q .tagName)
          file="conn3x_${tag#v}_linux_amd64.tar.gz"
          cd "$RUNNER_TEMP"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/$file"
          curl -sSfLO "https://github.com/conn3xorg/conn3x/releases/download/$tag/checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          mkdir -p bin && tar -xzf "$file" -C bin conn3x
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: conn3x version
      - run: conn3x fmt -check -recursive
      - name: Validate
        run: conn3x init -backend=false && conn3x validate
      - name: Validate the example
        working-directory: examples/local
        run: conn3x init -backend=false && conn3x validate

  e2e:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: [rocky10, fedora45, ubuntu2404, debian13]
    name: e2e (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The test host images live in the Conn3x repo.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: conn3xorg/conn3x
          ref: main
          path: conn3x
          persist-credentials: false
          sparse-checkout: test/images
      - name: Install Conn3x
        env: *gh
        run: *install
      - name: Start the ${{ matrix.distro }} host
        working-directory: examples/local
        env:
          CONTAINERFILE: ${{ github.workspace }}/conn3x/test/images/${{ matrix.distro }}/Containerfile
          # The host container is privileged, since Cockpit's units use systemd
          # sandboxing, which needs namespaces.
          PODMAN: sudo podman
        run: ./up.sh
      - name: Apply, then plan again with no changes
        working-directory: examples/local
        run: |
          conn3x init
          conn3x apply -auto-approve
          conn3x plan -detailed-exitcode
      # The test user exists only in CI. Cockpit logs in with HTTP basic auth
      # on a GET to /cockpit/login, and turns root away through
      # disallowed-users.
      - name: Check the socket, the login page and a login
        run: |
          sudo podman exec -i circuit-cockpit sh -eux <<'EOF'
          systemctl is-active cockpit.socket
          systemctl is-enabled cockpit.socket
          command -v curl >/dev/null || dnf -y -q install curl || { apt-get update -q && apt-get install -y -q curl; }
          curl -sSfk https://127.0.0.1:9090/ -o /tmp/login.html
          grep -q 'id="login"' /tmp/login.html
          grep -q 'Conn3x test box' /tmp/login.html
          useradd -m cockpittest
          echo 'cockpittest:Ci-only-pass-4821' | chpasswd
          [ "$(curl -sk -o /dev/null -w '%{http_code}' -u cockpittest:Ci-only-pass-4821 https://127.0.0.1:9090/cockpit/login)" = 200 ]
          [ "$(curl -sk -o /dev/null -w '%{http_code}' -u cockpittest:wrong https://127.0.0.1:9090/cockpit/login)" = 401 ]
          echo 'root:Ci-only-pass-4821' | chpasswd
          [ "$(curl -sk -o /dev/null -w '%{http_code}' -u root:Ci-only-pass-4821 https://127.0.0.1:9090/cockpit/login)" = 403 ]
          EOF
      - name: Clean up
        if: always()
        working-directory: examples/local
        env:
          PODMAN: sudo podman
        run: ./down.sh
